<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Argos — Conectar no Celular</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #050810;
        color: #f0f4ff;
        padding: 24px;
      }
      .card {
        text-align: center;
        background: #101828;
        border: 1px solid rgba(124, 58, 237, 0.35);
        border-radius: 20px;
        padding: 32px;
        max-width: 420px;
        width: 100%;
      }
      h1 { margin-top: 0; font-size: 22px; }
      p { color: #8a94b2; line-height: 1.5; }
      .url {
        background: #080d1a;
        padding: 12px;
        border-radius: 8px;
        font-family: monospace;
        color: #a78bfa;
        word-break: break-all;
        margin: 16px 0;
        font-size: 15px;
      }
      img {
        background: #fff;
        padding: 12px;
        border-radius: 12px;
      }
      .port-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 12px 0;
      }
      label { color: #8a94b2; font-size: 14px; }
      input[type=number] {
        background: #080d1a;
        border: 1px solid rgba(124,58,237,0.3);
        color: #a78bfa;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 14px;
        width: 80px;
        text-align: center;
      }
      button {
        background: #7c3aed;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 8px 18px;
        font-size: 14px;
        cursor: pointer;
        margin-top: 6px;
      }
      button:hover { background: #6d28d9; }
      code { color: #a78bfa; font-size: 13px; }
      .badge {
        display: inline-block;
        background: rgba(124,58,237,0.15);
        color: #c4b5fd;
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 12px;
        margin-bottom: 8px;
        border: 1px solid rgba(124,58,237,0.25);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Expo Go</div>
      <h1>📱 Conectar Argos no Celular</h1>
      <p>Escaneie com o app <strong>Expo Go</strong> (iOS / Android)</p>

      <div class="port-row">
        <label>Porta:</label>
        <input type="number" id="portInput" value="8082" min="1000" max="65535" />
        <button onclick="update()">Atualizar QR</button>
      </div>

      <div class="url" id="url">Detectando IP...</div>
      <br />
      <img id="qr" width="260" height="260" alt="QR Code" />

      <p style="margin-top:20px">
        📶 PC e celular na <strong>mesma rede Wi-Fi</strong><br />
        No PC rode <code>npm run web</code> na pasta <code>argos/</code>
      </p>
      <p><small>Ou no Expo Go: <em>Enter URL manually</em> → cole a URL acima</small></p>
    </div>

    <script>
      let detectedIp = null;

      // Tenta detectar IP local via WebRTC
      async function detectLocalIp() {
        return new Promise((resolve) => {
          try {
            const pc = new RTCPeerConnection({ iceServers: [] });
            pc.createDataChannel('');
            pc.createOffer().then((offer) => pc.setLocalDescription(offer));
            pc.onicecandidate = (e) => {
              if (!e.candidate) return;
              const match = e.candidate.candidate.match(
                /(\d{1,3}\.){3}\d{1,3}/
              );
              if (match && !match[0].startsWith('127.')) {
                detectedIp = match[0];
                pc.close();
                resolve(detectedIp);
              }
            };
            setTimeout(() => resolve(null), 3000);
          } catch {
            resolve(null);
          }
        });
      }

      function getPort() {
        return parseInt(document.getElementById('portInput').value) || 8082;
      }

      function update() {
        const ip = detectedIp || '192.168.1.XXX';
        const port = getPort();
        const url = `exp://${ip}:${port}`;
        document.getElementById('url').textContent = url;
        document.getElementById('qr').src =
          'https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=' +
          encodeURIComponent(url);
      }

      detectLocalIp().then((ip) => {
        if (ip) detectedIp = ip;
        update();
      });

      document.getElementById('portInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') update();
      });
    </script>
  </body>
</html>
