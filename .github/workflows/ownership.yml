name: Ownership Zones

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  ownership:
    name: Ownership Zones
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate changed paths against the claimed issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const changed = await github.paginate(
              github.rest.pulls.listFiles,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100 },
              response => response.data.map(file => file.filename),
            );

            const issueNumbers = [...(pr.body ?? '').matchAll(
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi,
            )]
              .map(match => Number(match[1]));
            const issueLabels = new Set();
            for (const issueNumber of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              for (const label of issue.labels) {
                issueLabels.add(typeof label === 'string' ? label : label.name);
              }
            }

            const isSolo = issueLabels.has('rodar-solo');
            const branch = pr.head.ref;
            // `hotfix/` e a valvula de escape: correcao de revisao e emergencia, que
            // por natureza atravessam zona. Nao dispensa PR nem revisao — so nao
            // e barrada por prefixo.
            const agent = branch.startsWith('claude/')
              ? 'claude'
              : branch.startsWith('codex/')
                ? 'codex'
                : branch.startsWith('hotfix/')
                  ? 'hotfix'
                  : null;

            const inPath = (file, roots) => roots.some(root =>
              root.endsWith('/') ? file.startsWith(root) : file === root
            );
            const claudeRoots = ['app/', 'components/', 'hooks/', 'services/voice/'];
            const codexRoots = ['api/', 'services/devices/', 'services/ai/', 'stores/'];
            // `docs/` NAO entra aqui: o WORK_PROTOCOL secao 3.6 manda o builder
            // "atualizar docs necessarias" ao fechar a tarefa, e o CONTEXT.md existe
            // para receber decisao nova a cada entrega. Tratar docs/ como SOLO fazia
            // as duas regras brigarem: o agente atualizava o CONTEXT como mandado, o
            // check falhava, e pela regra "bloqueou, PULA" ele abandonava trabalho
            // pronto. So o proprio protocolo fica protegido.
            const soloRoots = ['contracts/', '.github/', 'docs/ai/WORK_PROTOCOL.md'];

            const violations = [];
            for (const file of changed) {
              if (isSolo) continue;
              if (inPath(file, soloRoots)) {
                violations.push(`${file}: shared surface requires an issue labeled rodar-solo`);
              } else if (agent === 'hotfix') {
                continue;
              } else if (agent === 'claude' && inPath(file, codexRoots)) {
                violations.push(`${file}: reserved for CODEX`);
              } else if (agent === 'codex' && inPath(file, claudeRoots)) {
                violations.push(`${file}: reserved for CLAUDE`);
              } else if (!agent && inPath(file, [...claudeRoots, ...codexRoots])) {
                violations.push(`${file}: branch must start with claude/ or codex/`);
              }
            }

            if (violations.length > 0) {
              core.setFailed([
                'Ownership violation:',
                ...violations.map(violation => `- ${violation}`),
                'Link the claimed issue in the PR body. Cross-zone work must be split or labeled rodar-solo.',
              ].join('\n'));
            } else {
              core.info(`Ownership OK (${isSolo ? 'RODAR SOLO' : agent ?? 'neutral'}): ${changed.length} file(s).`);
            }
